services:
  ollama:
    image: ollama/ollama:0.34.2
    volumes:
      - models:/root/.ollama
    restart: unless-stopped
  model-init:
    image: ollama/ollama:0.34.2
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: /bin/sh
    command: ["-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen3:4b-instruct"]
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: qwen3:4b-instruct
    depends_on:
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  models:
